<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        table,th,td,tr{
            border: 1px;border-color: aliceblue;border-style: solid; border-collapse: separate;
        }
        table{
            background-color: chartreuse;border-spacing: 20px;
        }
        td,th,tr{
            background-color: azure; padding: 20p;padding: 20px;
        }
        tbody{
            margin-bottom: 20px;
        }
       
    </style>
</head>
<body>
    <table>
        <thead>
        <tr>
            <th>Days</th>
            <th>Weather</th>
        </tr></thead>
        <tbody>
        <tr>
            <td>Monday</td>
            <td>Sunday</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>Rainy</td>
        </tr></tbody>
    </table>
</body>
</html>
