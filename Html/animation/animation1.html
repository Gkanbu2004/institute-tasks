<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .logo{
            width: 100px;
            height: 100px;
            margin: 20px auto;
            border-radius: 50%;
            background-color: blue;
            color: aliceblue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
        }
        @keyframes logomove {
            from{
                transform: translateX(0);
            }
            to{
                transform: translatex(300px);
            }
        }
        .abox{
            animation-name: logomove;
            animation-duration: 2s;
            animation-iteration-count: unset;
            animation-direction: alternate;
        }
    </style>
</head>
<body>
    <div class="example">
        <h1>1.animation</h1>
        <p>logo</p>
        <div class="logo abox">LOGO</div>
    </div>
</body>
</html>
