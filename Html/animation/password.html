<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1{
            margin-left: 40%;margin-top: 10%;

        }
        input{
         color: black; border-radius: 10px;  border: 1px solid black;transition: box-shadow 5s ease-in-out ,background-color 2s ease-in-out,transform 2s ease;
        }
        input:hover{
            background-color: rgb(231, 61, 169);box-shadow: 5200px 0 0 0 goldenrod inset;
            transform: scale(1.05);
        }
        .a{
            width: 400px;height: 400px;border: 2px solid black;
            border-radius: 50px;background-color: aquamarine;position:absolute ;opacity: 0.7;
            
        }
        .b{
            position: absolute;left: 100px;top: 30%;
        }
    </style>
</head>
<body style="background-color:rgb(237, 228, 209) ;">
    
    <div class="div1 a">
        <div class="b">
    <H2>
        Enter a password
    </H2>
    <input type="password" id="password">
    <button onclick="login()">Login</button>
    <p id="message"></p></div></div>
</body>
<script>
    function login(){
        let password=document.getElementById("password").value;
        if(password=="1234"){
            window.location.href="loading.html"
        }
        else{
            document.getElementById("message").innerHTML="wrong password"
        }
    }
</script>
</html>
