<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 60px;
            height: 60px;
            border: 2px dotted rgb(246, 242, 242);
            border-radius: 50%;
            animation-name: spin;
            animation-duration: 4s;
            animation-timing-function: ease-in-out;
            animation-direction: alternate;
            transition: transform 1s;
            animation-iteration-count: infinite;background-color: blue;
        }
        @keyframes spin{
            0%{
transform:translateX(0) rotate(0deg) scale(1);
            }
            25%{
              transform:translateX(150px) rotate(90deg) scale(1.2); 
            }
            50%{
                transform:translateX(300px) rotate(180deg) scale(1.3);
            }
            75%{
                transform:translateX(150px) rotate(270deg)scale(1.5);
            }
            100%{
                transform:translateX(0) rotate(360deg) scale(1.6);
            }
            
        }
    </style>
</head>
<body>
    <div>

    </div>
</body>
</html>
