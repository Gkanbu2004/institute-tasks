<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a{
            display: inline-block;justify-content: space-between;margin-left:30px ;
            text-decoration: none;color: black;
            transition: box-shadow 3s ease-in-out,color 3s ease-in-out;
        }
        a:hover{
            box-shadow: 100px 0 0 0 blue inset;
            color: aliceblue;
        }
    </style>
</head>
<body>
    <a href="#">Home</a>
    <a href="#">Home</a>
    <a href="#">Home</a>
    <a href="#">Home</a>
</body>
</html>
