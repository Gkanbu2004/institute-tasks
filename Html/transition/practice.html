<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        div{
            width: 300px;height: 300px;
            background-color: white;border: 1px solid gray;border-radius: 10px;
            transition: transform 2s ease-in-out;
        }
        div:hover{
            transform: translateY(-10px) scale(1.05);
        }
        figure{
            position: absolute;left: 30px;top: 60px;
        }
        button{
            position: relative;left: 80px;top: 230px;
            transition: transform 3s ease-in-out,background-color 3s ease-in,color 3s ease-in-out;
        }
        img{
            transition: transform 3s ease-in-out;
        }
        img:hover{
            transform: scale(1.1) rotate(5deg);
        }button:hover{
            color: aliceblue;
            background-color: blue;
            transform: skewX(10deg) scale(1.1);
        }
    </style>
</head>
<body>
    
        <div>
          <figure>
            <img src="ph2.webp" alt="asd" width="100px" height="100px">
            <figcaption style="text-align: center;">
                Phone 
            </figcaption>
          </figure>
          <button>BUY</button>
        </div>
    
</body>
</html>
