<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a{
            box-shadow: 0 0 0 0 blue inset;
            color: brown;
            padding: 0;margin: 0;
            transition: color .3s ease-in-out, box-shadow .3s ease-in-out;
        }
        a:hover{
            box-shadow: 200px 0 0 0 blue inset;
            color:rgb(12, 253, 32);
        }
        a{
            text-decoration: none;
            line-height: 1.6;
            font-weight: 700;
            color: aqua;
        }
    </style>
</head>
<body>
    <a href="#">hello i am anbu</a>
</body>
</html>
