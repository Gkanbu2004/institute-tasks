<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p:first-child{
            color: blue;
        }
        p:last-child{
            color: brown;
        }
        p:nth-child(2){
            color: chocolate;
        }
        p:nth-child(3){
            color: darkcyan;
        }
        :lang(ta){
            background-color: blue;
        }
        p{
            display: none;
            background-color: chartreuse;
            padding: 20px;
        }
        .box1:hover p{
            display: block;
        }
        .box1{
            width: 50%;height: 210px; 
        }
    </style>
</head>
<body>
    <div class="box1">
    <p>hi i am anbumani</p>
    <p>hi i am anbumani</p>
    <p>hi i am anbumani</p>
    <p>hi i am anbumani</p>
      
    <p lang="ta">ffff</p></div>
</body>
</html>
