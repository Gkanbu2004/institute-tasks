<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;height: 200px;border: 2px solid black;position: absolute;
        }
        .a{
          background: linear-gradient(165deg,red,green);
      top: 60px;left: 180px;z-index: 3;
        }
        .b{
           background-image:repeating-linear-gradient(35deg,rgb(231, 222, 222) 0px,red 100px) ;
    top: 80px;left: 80px;z-index: 2;
        }
        .c{
            background-color: green;z-index: 1;

        }
    </style>
</head>
<body>
    <div class="box a">

    </div>
    <div class="box b">

    </div>
    <div class="box c">

    </div>
</body>
</html>
