        }

        }

        <li>one</li>
        <li>two</li>
        <li>three</li>
        <li>four</li>
    </ul><br><br>
    <ul>
        <li>one</li>
        <li>two</li>
        <li>three</li>
        <li>four</li>
    </ul><br><br>
    <ol class="a">
        <li>one</li>
        <li>two</li>
        <li>three</li>
        <li>four</li>
    </ol>
</body>
</html>
