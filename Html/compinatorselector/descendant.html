<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descendant combinator </title>
    <style>
        div~i{
            color: rgb(128, 13, 0);
            font-size: 200px;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <div>
        <i>hi</i><br>
        <i>helllo</i>
        <p><i>hello</i></p>
    </div>
    <i>i am</i>
    <i>abc</i>
    <i>hiii</i>
</body>
</html>
