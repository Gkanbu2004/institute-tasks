<style>
   
   #bt{
      width: 10%;

<body>
    <div class="card border border-dark p-2 m-4">
        <div class="card-body d-flex justify-content-between ">
            <label for="" class="form-label me-4">Name</label>
            <input type="text" class="form-control w-25  me-4" id="name">
            <label for="" class="form-labe me-4">Age</label>
            <input type="number" class="form-control me-4 w-25" id="age">
            <label for="" class="form-label me-4">Mark</label>
            <input type="number" class="form-control me-4 w-25" id="mark">
            <label for="" class="form-label me-4">course</label>
            <input type="text" class="form-control me-4 w-25" id="course"></div>
            <button class="btn btn-outline-primary "  id="bt">Add Student</button>
            <div class="card p-3 w-100 d-flex justify-content-between" id="result"></div>
            
        
    </div>
    <script>
       
        let students=[]
        let status;
        let res=document.getElementById("result");
        let b=document.getElementById("bt");
       function main(){
          
        let name=document.getElementById("name").value;
        let age=document.getElementById("age").value;
        let mark=document.getElementById("mark").value;
        let course=document.getElementById("course").value;
        
         if(name==="" || age===""|| mark===""|| course===""){
            res.innerText="Please fill all fieldset"
            return;
         }
         res.innerText = "";
         let student={name:name,
                  age:age,
                  mark:mark,
                  course:course
                  
         }
         students.push(student);
         displayStudents();
     

         //res.appendChild(card);

document.getElementById("name").value = "";
document.getElementById("age").value = "";
document.getElementById("mark").value = "";
document.getElementById("course").value = "";
       }
       function displayStudents(){
         res.innerHTML=""
         students.forEach(function(student){
            let card=document.createElement("div")
            card.classList.add("card","p-3" ,"mb-3")
             let deletebtn=document.createElement("button");
         deletebtn.innerText="delete"
         deletebtn.classList.add("btn","btn-danger");
 deletebtn.addEventListener("click",function(){
   card.remove();
 })

                if (student.mark >= 40) {

                    status = "Pass";

                } else {

                    status = "Fail";
                }

            card.innerHTML=`<h3>Name:${student.name}</h3>
         <p>Age:${student.age}</p>
         <p>Mark:${student.mark}</p>
         <p>Course:${student.course}</p>
         <p>Result:${status}`
            res.appendChild(card);
  card.appendChild(deletebtn);
  
         })
         
 
       }
      b.addEventListener("click",main)
      
    </script>
