<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .demo{
            color: green;
            background-color: blanchedalmond;
            font-size: larger;
            font-weight: bold;

        }
        .bd{
            background-color: black;
        }
    </style>
</head>
<body id="bd">
    <h2 id="head">hi i am anbumani</h2>
    <button onclick="change()">click</button>
    <script>
        function change(){
        let c=document.getElementById("head");
        let d=document.getElementById("body")
        c.classList.toggle("demo");
        //c.classList.remove("demo")
        d.classList.toggle("bd")
        }
        
    </script>
</body>
</html>
