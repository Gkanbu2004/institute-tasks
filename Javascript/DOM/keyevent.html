<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="keyup">keyup</button>
    <input type="text" name="" id="na">
    <p id="ans"></p>
    <script>
        let n=document.getElementById("na");
       // n.addEventListener("keydown",function(){
           // document.getElementById("ans").innerHTML="key pressed"
        //})
         n.addEventListener("keyup",function(){
            document.getElementById("ans").innerHTML=n.value;
        })
    </script>
</body>
</html>
