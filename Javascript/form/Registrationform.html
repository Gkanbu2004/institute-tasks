<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
     <style>
        .wrong{
           border: 2px solid red;
            
        }
        .success {
    border: 2px solid green;
}
     </style>
</head>
<body>
    

<form action="" id="myform">
<label for="">name:</label>
   <input type="text" id="name"><br>
   <p id="nameerror"></p>
<label for="">email</label>
   <input type="email" id="email"><br>
   <p id="emailerror"></p>
<label for="">Age</label>
   <input type="number" id="age"><br>
   <p id="ageerror"></p>
<label for="">Password</label>
   <input type="password" id="password"><br>
   <p id="passworderror"></p>
<label for="">Confirm password</label>
   <input type="password" id="cpassword"><br>
   <p id="cperror"></p>
<label for="">Gender</label>
   <input type="radio" id="male" name="Gender">
   <label for="">male</label>
   <input type="radio" id="Female" name="Gender">
   <label for="">Female</label>
   <input type="radio" id="others" name="Gender">
   <label for="">others</label><br>
   <p id="gentererror"></p>
<label for="">Skills</label>
   <input type="checkbox" id="java">
   <label for="">Java</label>
    <input type="checkbox" id="c">
   <label for="">C</label>
    <input type="checkbox" id="html">
   <label for="">html</label>
    <input type="checkbox" id="css">
   <label for="">css</label><br>
   <p id="skillerror"></p>
<select name="" id="course">
    <option value="">Select course</option>
    <option value="fs">fs</option>
    <option value="Ds">Ds</option>
    <option value="Aws">Aws</option>
</select>
<p id="courseerror"></p>
<br><br>

<textarea name="" id="textarea"></textarea>
<br>
<p id="addressError"></p>

<input type="checkbox" id="term">
<label for="">Terms and condition</label>
<p id="termerror"></p>
<button type="submit">Submit</button>

</form>
<script>
let form=document.getElementById("myform");
form.addEventListener("submit",function(e){
e.preventDefault();

let name=document.getElementById("name")
let nameerror=document.getElementById("nameerror");
let email=document.getElementById("email").value;
let emailerror=document.getElementById("emailerror");
let age=document.getElementById("age").value;
let ageerror=document.getElementById("ageerror");
let password=document.getElementById("password").value;
let passworderror=document.getElementById("passworderror");
let cpassword=document.getElementById("cpassword").value;
let cperror=document.getElementById("cperror");
let male =document.getElementById("male");
let female =document.getElementById("Female");
let others=document.getElementById("others");
let gentererror=document.getElementById("gentererror");
let java=document.getElementById("java");
let c=document.getElementById("c");
let html=document.getElementById("html");
let css=document.getElementById("css");
let skillerror=document.getElementById("skillerror");
let course=document.getElementById("course");
let courseerror=document.getElementById("courseerror");
let textarea=document.getElementById("textarea");
let addressError=document.getElementById("addressError");
let term=document.getElementById("term");
let termerror=document.getElementById("termerror");
let valid=true;
//name;
if(name.value.trim()===""){
    nameerror.innerHTML="Please enter name";
    valid=false;
    name.classList.add("wrong");
    name.classList.value.remove("success");
}
else{
    nameerror.innerHTML="";
    name.classList.add("success");
     name.classList.remove("wrong");
}

//email
if(email.trim()===""){
    emailerror.innerHTML="please enter email correct";
    valid=false;
}
else if(!email.includes("@")){
      emailerror.innerHTML = "Please enter valid email";
        valid = false;

}
else{
     emailerror.innerHTML = "";

}
//age
if(age===""){
    ageerror.innerHTML="please enter the age";
    valid=false;
}
else{
    ageerror.innerHTML="";
}
//passweord
 if (password === "") {

        passworderror.innerHTML = "Please enter password";
        valid = false;

    } else if (password.length < 8) {

        passworderror.innerHTML =
            "Password must contain 8 characters";

        valid = false;

    } else {

        passworderror.innerHTML = "";

    }
    if(cpassword===""){
        cperror.innerHTML="please enter confirmpassword";
        valid=false;
    }
    else if(password!==cpassword){
        cperror.innerHTML="password does not match";
        valid=false;
    }
    else{
        cperror.innerHTML="";
    }

    //gender

    if(male.checked===false && female.checked===false && others.checked===false){
        gentererror.innerHTML="please selsect genter";
        valid=false;
    }
    else{
        gentererror.innerHTML="";
    }
    //checkbox

    if(java.checked===false && c.checked===false && html.checked===false && css.checked===false){
        skillerror.innerHTML="please select atleast one skill ";
        valid=false;
    }
    else{
        skillerror.innerHTML="";
    }
    //Course
    if (course.value === "") {

        courseerror.innerHTML = "Please select course";
        valid = false;

    } else {

        courseerror.innerHTML = "";

    }
 if (textarea.value.trim() === "") {

        addressError.innerHTML = "Please enter address";
        valid = false;

    } else {

        addressError.innerHTML = "";

    }

    //terms
    if(term.checked===false){
termerror.innerHTML =
            "Please accept terms and conditions";

        valid = false;

    } else {

        termerror.innerHTML = "";

    

    }
    if(valid===true){
        alert("Registration successfully");
        form.reset();
    }


})

</script>
</body>
</html>
