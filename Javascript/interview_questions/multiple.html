<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="card border border-dark w-25 ms-5 bg-info ">
        <div class="card-body p-4 ms-4 mt-4">
            <h2 class="card-title text-center text-danger">Multiplication table</h2>
            <label for="" class="form-label ">Choose a table number</label>
            <input type="number" class="form-control" name="" id="val">
            <div class="card border border-dark  w-50 mt-4 p-3 bg-warning" id="result"></div>
            <button class="btn btn-outline-primary mt-4 text-danger" id="bt">click</button>
        </div>
    </div>
<script>
    let len=20;
    function mul(){
        let value=document.getElementById("val").value;
        let ans=document.getElementById("result");
        for(let i=1;i<=len;i++){
            ans.innerHTML+=`${i}*${value}=${i*value}<br>`
           
        }
    }
    let b=document.getElementById("bt");
    b.addEventListener("click",mul)
</script>
</body>
</html>
