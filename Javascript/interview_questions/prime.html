<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="card border-success w-50 p-2 ms-3 mt-3">
        <div class="card-body">
            <h2 class="card-title text-center">Check prime number</h2>
            <label for="" class="form-label">Number</label>
            <input type="number" class="form-control " id="num" placeholder="Enetr the value">
            <div class="border border-dark mt-3 text-danger text-center"style="hight:80px;" id="res" ></div>
            <button class="btn btn-primary mt-3" onclick="prime()">click</button>
        </div>
    </div>
    <script>
        let count=0;
        let i=2;
        function prime(){
            let val=document.getElementById("num").value;
           let ans=document.getElementById("res");
            
            while(i<val){
                if(val%i==0){
                    count++;
                }
                i++;
            }
            if(val<=1){
              ans.innerHTML=`${val} is not prime number`
            }
            else if(count==0){
                ans.innerHTML=`${val} is prime number`
            }
            else{
                 ans.innerHTML=`${val} is not prime number`
            }
        }
       
            
        
    </script>
</body>
</html>
