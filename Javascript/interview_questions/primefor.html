<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="card border border-dark border2 w-50 p-4">
        <div class="card-body">
            <h2 class="card-title text-center">Check Prime number</h2>
            <label for="" class="form-label">Value</label>
            <input type="text" name="" id="num" class="form-control">
            <div class="card border border-dark mt-4" id="result"></div>
            <button class="btn btn-outline-primary mt-4" id="view">click</button>
        </div>
    </div>
    <script>
        let prime=true;
        function primenumber(){
            let value=document.getElementById("num").value;
            let answer=document.getElementById("result");
            if(value<=1){
                prime=false;
            }
            else{
                for(let i=2;i<value;i++){
                    if(value%i==0){
                        prime=false;
                        break;
                    }
                }
            }
            if(prime){
                answer.innerHTML=`${value} is prime number`
            }
            else{
                answer.innerHTML=`${value} is not prime number`
            }
        }
        let b=document.getElementById("view");
        b.addEventListener("click",primenumber);
    </script>
</body>
</html>
