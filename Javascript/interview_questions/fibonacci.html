<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
     <div class="card border border-dark border2 w-50 p-4">
        <div class="card-body">
            <h2 class="card-title text-center">fibonacci number</h2>
            <label for="" class="form-label">Value</label>
            <input type="text" name="" id="num" class="form-control">
            <div class="card border border-dark mt-4" id="result"></div>
            <button class="btn btn-outline-primary mt-4" id="view">click</button>
        </div>
    </div>
    <script>
        
        function fibo(){
            let first=0;
        let second=1;
        let f;
            let value=Number(document.getElementById("num").value);
            let answer=document.getElementById("result");
            if(value==first){
                answer.innerHTML=first;
            }
            else if(value==second){
                answer.innerHTML=second;
            }
            else{
            let i=2;
            while(value>i){
             f=first+second;
              
                 first=second;
                 second=f;
                 i++;
                answer.innerHTML+= +second+" ";
            }
            
        }
    }
    let bt=document.getElementById("view");
    bt.addEventListener("click",fibo);
    </script>
</body>
</html>
