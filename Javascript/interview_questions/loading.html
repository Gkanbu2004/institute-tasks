<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading</title>
    <style>
        .box{
            width: 30px;height: 30px;border: 3px dotted rgb(59, 57, 57);border-radius: 50%;border-top: rgb(0, 162, 255) solid;
           
            animation-name:logo ;
            animation-duration:1s ;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            animation-direction: normal;opacity: 0.5;
            animation-play-state: running;
            
        }
        @keyframes logo{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }

        }
         .a{
           display: flex;justify-content: center;min-height: 100vh;align-items: center;text-align: center;
         }
         .box:hover{
            animation-play-state: paused;
         }
    </style>
</head>
<body style="background-color: black;">
    
    <div class="a">
        <figure>
    <div class=" box">
  >
    </div>
    <figcaption style="color: aliceblue; margin-top: 10px;opacity: 0.8;">Loading</figcaption>
    </figure>
   
</div>
<script>
    setTimeout(function(){
        window.location.href="animationlogo.html"
    },10000)
</script>
</body>

</html>
