<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let str="iauiowq";
        let vow=""
        let c=0,v=0;
        for(let i=0;i<str.length;i++){
            vow=str.charAt(i);
            let low=vow.toLocaleLowerCase();
            if(low=='a'||low=='e'||low=='i'||low=='o'||low=='u'){
                v++;
            }
            else{
              c++;
            }
        }
        console.log(v)
        console.log(c)
    </script>
</body>
</html>
