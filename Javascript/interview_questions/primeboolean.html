<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="card border border-dark border-2 w-50 p-3 ms-5 mt-5">
        <div class="card-body">
            <h3 class="card-title">Check Prime number</h3>
             <label for="" class="form-label" >Value</label>
             <input type="number" class="form-control" id="val">
             <div class="card border border-dark mt-4" id="result"></div>
             <button class="btn btn-outline-primary mt-4 " id="bt">click</button>
        </div>
    </div>
    <script>
        let i=2;
        let prime=true;
        function primenumber(){
            let value=document.getElementById("val").value;
            let answer=document.getElementById("result");
            if(value<=1){
                prime=false;
            }
            else{
            while(i<value){
                if(value%i==0){
                    prime=false;
                    break;
                }
                i++;
            }
        }

        if(prime){
            answer.innerHTML=value+"is prime number."
        }
        else{
            answer.innerHTML=value+"is not prime number"
        }

        }
        let b=document.getElementById("bt");
        b.addEventListener("click",primenumber
            
        )
    </script>
</body>
</html>
