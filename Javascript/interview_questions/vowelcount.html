<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="card border border-dark w-50">
        <div class="card-body p-3">
            <p class="d-2 text-center text-primary" >Count vowels and constant and symbol</p>
            <label for="" class="form-label">String:</label>
            <input type="text" class="form-control" id="str">
            <button class="btn btn-outline-primary" id="bt">clcik</button>
            <div class="p-4 border border-dark" id="result"></div>

        </div>
    </div>
    <script>
        
        let sp
       let c=0;
       let v=0;
       let sy=0;
       function main(){
        let s=document.getElementById("str").value;
        let r=document.getElementById("result");
        let l=s.toLowerCase();
        for(let i=0;i<l.length;i++){
            sp=l[i];
            if(sp==="a" || sp==="e"|| sp==="i" || sp==="o"|| sp==="u"){
               v++;
            }
            else if(sp>='a'  &&   sp<='z'){
 c++;
            }
            else{
                sy++;
            }
        }
        r.innerText+=`vowels :${v}constant:${c}Symbols:${sy}`
    }
    let b=document.getElementById("bt");
    b.addEventListener("click",main)
    </script>
</body>
</html>
