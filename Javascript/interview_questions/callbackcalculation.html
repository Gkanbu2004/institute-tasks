<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function add(a,b){
            return a+b;
        }
        function sub(a,b){
            return a-b;
        }
        function mul(a,b){
            return a*b;
        }
        function call(a,b,callback){
            let c=callback(a,b);
            console.log(c);
        }
        call(20,30,add);
        call(30,2,sub);
        call(2,3,mul)
    </script>
</body>
</html>
