<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,tr,th,td{
            border: 2px solid black;
            text-align: center;
            padding: 10px;
        }
        table{
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <button onclick="fetchex(displayex)" >click</button>
    <button onclick=""></button>
    <p id="display"></p>
    <script>
        function fetchex(callback){
            let promise=new Promise((resolve,reject)=>{
            fetch('https://jsonplaceholder.typicode.com/todos')
            .then(response=>{
                if(response.ok){
               return response.json();}

               else{
                reject("server error"+response.status)
               }
            })
            .then(data=>{
                resolve(data)
            })
            .catch(error=>{
                reject(error)
            });
             });
            

             promise.then(data=>{
                callback(data);
             })
            .catch(error=>{
                document.getElementById("display").innerHTML=error;
            })
        }
    
        
        function displayex(data){
          let table=`<table>
                    <tr>
                        <th>User ID</th>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Completed</th>
                    </tr>`;

                    data.forEach((a)=>{
                         table+=`<tr> <td> ${a.userId}</td><td> ${a.id}</td><td> ${a.title}</td><td> ${a.completed ? 'yes':'no'}</td></tr>`
                    })
                    table+=`</table>`
                    document.getElementById("display").innerHTML=table;
        }
       
//Rewrite promise code using async/await.  
async function usertrycatch(){
            const output=document.getElementById("output");
            output.textContent+="Fetching data from API with fetch()...\n";
            try{
              const response=await fetch('https://jsonplaceholder.typicode.com/users');
              if(response.ok){
                const data=await response.json();
                output.textContent+="ApI Data (using try ...car=tch):\n"+JSON.stringify(data,null,2);
              } 
              else{
                output.textContent=`Server responded with status:${response.status}`;
              } 


            }
            catch(error){
output.textContent="Error (caught by catch block:)"+error;
            }
            finally{
                output.textContent+="\n\n-----|n Operatin completed."
            }
        }
    

    </script>
</body>
</html>
