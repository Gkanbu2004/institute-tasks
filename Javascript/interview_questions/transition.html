<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
            transitions make the element smoothly and gradually change from one state to another. 
             
            Order of transition property values are important i.e: 
            transition-property: width; 
            transition-duration: 2 seconds; 
            transition-timing-function: linear; 
            transition-delay : 1 second;             
            */ 
        .box{
            width: 100px;
            height: 100px;
            border: 2px solid black;
            background-color: green;
            margin: 20px;
            transition-property: width,background-color;
            transition-duration: 4s;
            transition-delay: 1s;
        }
        .box:hover{
            width: 400px;
            background-color: brown;
        }
                /* Different timing functions for each box  
            The transition-timing-function property specifies the speed curve of the transition effect. 
            This property can have one of the following values: 
            ease - transition will start slow, then go fast, and end slow (this is default) 
            linear - transition will keep the same speed from start to end 
            ease-in - transition will start slow 
            ease-out - transition will end slow 
            ease-in-out - transition will have a slow start and end 
            step-start - the transition immediately jumps to the final state of the property 
            step-end - the transition immediately jumps to the final state of the property 
              
        */ 
        .a{
            transition-timing-function: ease;
            
        }
        .b{
            transition-timing-function: ease-in;
        }
        .c{
            transition-timing-function:ease-out ;
        }
        .d{
            transition-timing-function: ease-in-out;
        }
        .e{
            transition-timing-function: linear;
        }
        .f{
            transition-timing-function: step-start;
        }
        .g{
            transition-timing-function: step-end;
        }
        .h{
            transition-timing-function: steps(4);
        }

    </style>
    
</head>
<body>
    
    <div class="box a"></div>
    <div class="box b"></div>
    <div class="box c"></div>
    <div class="box d"></div>
    <div class="box e"></div>
    <div class="box f"></div>
    <div class="box g"></div>
    <div class="box h"></div>

</body>
</html>
