<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="oa" style="border: 2px solid palevioletred;width: 100px; height: 60px;"></div>
    <button onclick="sliceex()">click</button>
    <div id="na"  style="border: 2px solid palevioletred;width: 100px; height: 60px;"></div>
    <script>
        function sliceex(){
            let arr=[1,2,3,4,5,6,7]
            document.getElementById("oa").innerHTML=arr
            let newarr=arr.slice(3,5);
            document.getElementById("na").innerHTML=newarr
        }

    </script>
</body>
</html>
