<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="ans"></p>
    <script>
        let student=new Promise((pass,fail)=>{
            
            pass(35);
        })
        student.then(m=>{
            m+=5;
            return m;
        })
        .then(m=>{
            if(m>40){
                 document.getElementById("ans").innerHTML+="eligible"
            }
           else{
             document.getElementById("ans").innerHTML+="not eligible"
           }
        })
        .catch(error=>{
             document.getElementById("ans").innerHTML+="mark not valid"
        })
    </script>
</body>
</html>
