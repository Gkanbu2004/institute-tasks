<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="b1">button1</button>
     <button id="b2">button2</button>
     <p id="p1">count:0</p>
     <p id="p2">count:0</p>
     <script>
        function multicounter(){
            counter1=0;
            
            return{
             button1:function(){
               counter1++;
               document.getElementById("p1").innerHTML="count:"+counter1;
             },
             button2:function(){
               counter1++;
               document.getElementById("p2").innerHTML="count:"+counter1;
            }
        }
    }
    let Mc=multicounter();
    let Ma=multicounter();
    document.getElementById("b1").addEventListener("click",Mc.button1)
      document.getElementById("b2").addEventListener("click",Ma.button2)
     </script>
</body>
</html>
