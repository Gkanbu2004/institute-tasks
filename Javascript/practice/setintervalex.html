<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="ans"></p>
    <script>
        let count=1;
        let timer=setInterval(()=>{
            document.getElementById("ans").innerHTML+=count+"<br>";
           count++;
           if(count>5){
            clearInterval(timer);
           } 
        },2000)
    </script>
</body>
</html>
