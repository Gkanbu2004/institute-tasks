<!DOCTYPE html> 
<html> 
<body> 
<!--Clicked is an argument--> 
<button id="myBtn" onclick="changeText('clicked')">Click Me</button> 
 
<script> 
 
function changeText(Text) {   // Parameter 
    alert(Text); 
    document.getElementById("myBtn").innerText = Text; 
} 
 
</script> 
 
</body> 
</html>
