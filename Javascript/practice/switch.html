<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let a=10;
    let b=20;
    let sy=prompt("Enter the sympol");
    switch(sy){
        case '+':
            console.log(a+b);
            break;
          case '-':
            console.log(a-b);
            break;
          case '*':
            console.log(a*b);
            break;
          case '/':
            console.log(a/b);
            break;
          case '%':
            console.log(b%a);
            break;
          case '**':
            console.log(a**2);
            break;
        default:
            console.log("not valid")
    }
    </script>
</body>
</html>
