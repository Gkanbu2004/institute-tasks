!<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
       table tr td th{
        border: 2px solid rgb(23, 11, 20);
        
       }
    </style>
</head>
<body style="background-color: blanchedalmond;">
    
    <div id="getdata" class="main_box"></div>
    <script>
        function fetchex(handleData){
            fetch('https://jsonplaceholder.typicode.com/todos')
            .then(response=>{
                return response.json();
            })
            .then(response=>{
                handleData(response);
            })
            .catch(error=>document.getElementById("getdata").innerHTML=error);

        }
        function handleData(response){
            let table=` <table>
                    <tr>
                        <th>User ID</th>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Completed</th>
                    </tr>
            `;
            response.forEach((a) => {
            table+=`<tr> <td> ${a.userId}</td><td> ${a.id}</td><td> ${a.title}</td><td> ${a.completed ? 'yes':'no'}</td></tr>`
                 
        })
        document.getElementById("getdata").innerHTML=table;
            }
        fetchex(handleData);
    </script>
</body>
</html>
