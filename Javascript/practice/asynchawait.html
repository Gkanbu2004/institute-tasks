<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Fetch Api using try...catch and response check</h2>
    <button onclick="usertrycatch()">Fetch Data</button>
    <pre id="output"></pre>
    <script>
        async function usertrycatch(){
            const output=document.getElementById("output");
            output.textContent+="Fetching data from API with fetch()...\n";
            try{
              const response=await fetch('https://jsonplaceholder.typicode.com/users');
              if(response.ok){
                const data=await response.json();
                output.textContent+="ApI Data (using try ...car=tch):\n"+JSON.stringify(data,null,2);
              } 
              else{
                output.textContent=`Server responded with status:${response.status}`;
              } 


            }
            catch(error){
output.textContent="Error (caught by catch block:)"+error;
            }
            finally{
                output.textContent+="\n\n-----|n Operatin completed."
            }
        }
    </script>
</body>
</html>
