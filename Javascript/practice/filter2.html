<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="oa" style="border: 2px solid red ; width: 200px; height: 50px;"></div>
    <button onclick="showresult()">map()</button>
    <h2 id="res"style="border: 2px solid red ; width: 200px; height: 50px;"></h2>
    <script>
        let arr=[28,56,32,23,1,2,12,15,78,90,23,45,87]
        document.getElementById("oa").innerHTML=arr;
        let ab=arr.filter(val=>{
            return val>=18;
        })
        function showresult(){
            document.getElementById("res").innerHTML=ab;
        }
    </script>
</body>
</html>
